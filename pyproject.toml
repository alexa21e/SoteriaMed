[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soteriamed"
version = "0.1.0"
description = "Safety-constrained hybrid RAG for lay-language symptom triage"
requires-python = ">=3.11"

# Runtime dependencies deliberately live in requirements.txt, not here.
# Keeping one source of truth avoids the two drifting apart; `pip install -e .`
# installs the package, `pip install -r requirements.txt` installs what it needs.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
